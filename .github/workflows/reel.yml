name: Publicar reel en Instagram

on:
  schedule:
    # 22:00 UTC = 19:00 en Argentina, lunes / miércoles / viernes.
    - cron: "0 22 * * 1,3,5"
    # 23:40 UTC = 20:40 en Argentina — red de seguridad del mismo día.
    - cron: "40 23 * * 1,3,5"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha del reel (AAAA-MM-DD). Vacío = hoy. Tiene que ser lun, mié o vie."
        required: false
      solo_generar:
        description: "true = genera el video pero NO publica"
        required: false
        default: "false"
      forzar:
        description: "true = publica aunque ya figure como publicado"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Candado: evita publicar dos veces el mismo reel.
      - name: ¿El reel de hoy ya salió?
        id: candado
        run: |
          FECHA="${{ github.event.inputs.fecha }}"
          [ -z "$FECHA" ] && FECHA=$(date -u +%F)
          echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.forzar }}" = "true" ]; then
            echo "Forzado: publico igual."
            echo "saltear=false" >> "$GITHUB_OUTPUT"
          elif grep -qx "$FECHA" reels/publicados.txt 2>/dev/null; then
            echo "El reel del $FECHA ya está publicado. No hago nada."
            echo "saltear=true" >> "$GITHUB_OUTPUT"
          else
            echo "saltear=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.candado.outputs.saltear != 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.candado.outputs.saltear != 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium
          ffmpeg -version | head -1

      - name: Generar el reel
        id: gen
        if: steps.candado.outputs.saltear != 'true'
        env:
          FECHA: ${{ steps.candado.outputs.fecha }}
        run: python scripts/reel.py

      - name: Guardar el reel en el repo
        if: steps.candado.outputs.saltear != 'true'
        run: |
          git config user.name  "axioma-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main || true
          git add reels/
          git diff --staged --quiet || git commit -m "reel ${{ steps.gen.outputs.fecha }}"
          git push

      - name: Esperar a que el video quede accesible
        if: steps.candado.outputs.saltear != 'true'
        run: sleep 30

      - name: Publicar en Instagram
        if: steps.candado.outputs.saltear != 'true' && github.event.inputs.solo_generar != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/reels/${{ steps.gen.outputs.archivo }}
          CAPTION_FILE: reels/${{ steps.gen.outputs.fecha }}.txt
          REGISTRO: reels/publicados.txt
          FECHA: ${{ steps.gen.outputs.fecha }}
        run: python scripts/publicar.py

      - name: Anotar que ya se publicó
        if: steps.candado.outputs.saltear != 'true' && github.event.inputs.solo_generar != 'true'
        run: |
          git config user.name  "axioma-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main || true
          git add reels/publicados.txt
          git diff --staged --quiet || git commit -m "reel publicado ${{ steps.gen.outputs.fecha }}"
          git push

      - name: Subir el reel como artefacto
        if: steps.candado.outputs.saltear != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.gen.outputs.fecha }}
          path: reels/${{ steps.gen.outputs.fecha }}.*
