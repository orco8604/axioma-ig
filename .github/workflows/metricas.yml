name: Cosechar métricas de Instagram

on:
  schedule:
    # Domingos 13:00 UTC = 10:00 en Argentina.
    - cron: "0 13 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Medir
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/metricas.py

      - name: Guardar la medición
        run: |
          git config user.name  "axioma-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main || true
          git add metricas/
          git diff --staged --quiet || git commit -m "métricas $(date -u +%F)"
          git push
