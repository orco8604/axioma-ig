name: Refrescar el token de Instagram

# El token de larga duración de Meta dura 60 días. Este workflow lo renueva
# cada 3 semanas y guarda el nuevo en los Secrets del repo, así nunca se vence.
#
# Requiere un secret extra: GH_PAT
#   token personal de GitHub (fine-grained), alcance: solo este repo,
#   permiso "Secrets: Read and write".
# Si preferís no crear el PAT, borrá el paso "Guardar el token nuevo":
# el workflow te va a avisar por mail cuando falte poco, y lo cargás a mano.

on:
  schedule:
    - cron: "0 12 */21 * *"
  workflow_dispatch:

jobs:
  refrescar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir un token nuevo
        id: refresh
        run: |
          RESP=$(curl -sS -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=${{ secrets.IG_ACCESS_TOKEN }}")
          echo "$RESP" | grep -q access_token || { echo "Falló el refresco: $RESP"; exit 1; }
          TOKEN=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "Vence en $(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["expires_in"]//86400)') días"

      - name: Guardar el token nuevo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Sin el PAT no hay forma de escribir el secret. Avisamos y salimos
          # bien: el token viejo sigue andando hasta que se venza.
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Falta el secret GH_PAT: el token nuevo no se pudo guardar."
            echo "::warning::Creá un token fine-grained de GitHub con permiso 'Secrets: Read and write' sobre este repo y guardalo como GH_PAT."
            echo "::warning::Mientras tanto el token viejo sigue sirviendo, pero hay que renovarlo a mano antes de que venza."
            exit 0
          fi
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" \
            --body "${{ steps.refresh.outputs.token }}"
          echo "Token actualizado."
